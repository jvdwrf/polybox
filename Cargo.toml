[workspace]
resolver = "3"
members = [
    "crates/codegen",
    "crates/type-sets",
    "crates/zestors",
    "crates/inspector",
    "crates/zestors-channel",
    "crates/api-server",
    "crates/zestors-core",
]

[workspace.dependencies]
zestors-codegen = { path = "crates/codegen", version = "0.0.2" }
zestors = { path = "crates/zestors", version = "0.1.0" }
type-sets = { path = "crates/type-sets" }
zestors-channel = { path = "crates/zestors-channel" }
zestors-inspector = { path = "crates/inspector" }
zestors-api-server = { path = "crates/api-server" }
zestors-core = { path = "crates/zestors-core" }


tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
derive_more = { version = "2", features = ["full"] }
flume = "0.12"
tracing = "0.1"
rootcause = "0.13"
indexmap = "2"
async-channel = "2"
smol_str = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
dashmap = { version = "6", features = ["serde"] }
arc-swap = { version = "1", features = ["serde"] }
rand = { version = "0.10" }
bs58 = { version = "0.5" }
axum = "0.8"
serde_json = "1"
axum-autoroute = { version = "0.2", features = [] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
vtable = "0.4"
concurrent-queue = "2"
eyeball = "0.8"
jiff = { version = "0.2", features = ["serde"] }
anyhow = "1.0"
serde_with = "3"
reqwest = { version = "0.13" }
axum-typed-routing = { version = "0.4" }


iced = { version = "0.14" }
iced_test = { version = "0.14", features = [] }
