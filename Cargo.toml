[workspace]
resolver = "3"
members = ["polybox-codegen", "type-sets", "zestors", "zestors-gen-oapi"]

[workspace.dependencies]
polybox-codegen = { path = "polybox-codegen", version = "0.0.2" }
zestors = { path = "zestors", version = "0.1.0" }


tokio = { version = "1", features = ["full"] }
type-sets = { path = "type-sets" }
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
derive_more = { version = "2", features = ["full"] }
flume = "0.12"
tracing = "0.1"
anyhow = "1"
indexmap = "2"
async-channel = "2"
smol_str = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
dashmap = { version = "6", features = ["serde"] }
arc-swap = { version = "1", features = ["serde"] }
rand = { version = "0.10" }
bs58 = { version = "0.5" }
axum = "0.8"
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = { version = "0.2" }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
axum-autoroute = { version = "0.2", features = [] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
