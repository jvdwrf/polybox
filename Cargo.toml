[workspace]
resolver = "3"
members = ["polybox", "polybox-codegen", "polybox-core", "zestors"]

[workspace.dependencies]
polybox-codegen = { path = "polybox-codegen", version = "0.0.2" }
polybox-core = { path = "polybox-core", version = "0.0.2" }
polybox = { path = "polybox", version = "0.0.2" }


tokio = { version = "1", features = ["full"] }
type-sets = "0.0.6"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
derive_more = { version = "2", features = ["full"] }
flume = "0.12"
tracing = "0.1"
anyhow = "1"
