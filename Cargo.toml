[workspace]
resolver = "3"
members = ["polybox-codegen", "zestors"]

[workspace.dependencies]
polybox-codegen = { path = "polybox-codegen", version = "0.0.2" }
# polybox-core = { path = "polybox-core", version = "0.0.2" }
# polybox = { path = "polybox", version = "0.0.2" }


tokio = { version = "1", features = ["full"] }
type-sets = "0.0.7"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
derive_more = { version = "2", features = ["full"] }
flume = "0.12"
tracing = "0.1"
anyhow = "1"
indexmap = "2"
async-channel = "2"
smol_str = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
dashmap = { version = "6", features = ["serde"] }
arc-swap = { version = "1", features = ["serde"] }
rand = { version = "0.10" }
bs58 = { version = "0.5" }
